image: maven:3.8.6-openjdk-11
stages:
  - build
  - test

variables:
  MAVEN_CLI_OPTS: "-s ci_settings.xml --batch-mode"

build:
  stage: build
  script:
    - './mvnw $MAVEN_CLI_OPTS compile'
  tags:
    - vips-docker

test:
  stage: test
  script:
    - './mvnw $MAVEN_CLI_OPTS test'
  tags:
    - vips-docker