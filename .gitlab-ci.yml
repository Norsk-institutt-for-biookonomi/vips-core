image: openjdk:11-jdk
stages:
  - deploy

variables:
  COMMON_CONFIG_REMOTE: https://root:$CONFIG_ACCESS_TOKEN@$CI_SERVER_HOST/VIPS/vips-common-config.git
  COMMON_CONFIG_LOCAL: "vips-common-config"
  SETTINGS_XML: "ci_settings.xml"
  MAVEN_POM: "-f pom.xml"
  MAVEN_POM_WITH_MODELS: "-f pom_with_models.xml"
  MAVEN_CLI_OPTS: "-s $SETTINGS_XML --batch-mode"
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository -Dmaven.artifact.threads=10"
  MAIN_BRANCH: "main"
  RELEASE_BRANCH: "release"
  DEPLOYMENT_PATH: "/home/wildfly/deployments"
  ARCHIVE_PATH: "/home/wildfly/archive"

cache:
  paths:
    - .m2/repository/

before_script:
  - git config --global user.name "${GITLAB_USER_NAME}"
  - git config --global user.email "${GITLAB_USER_EMAIL}"
  - echo "Get common settings"
  - git clone $COMMON_CONFIG_REMOTE $COMMON_CONFIG_LOCAL
  - cd $COMMON_CONFIG_LOCAL
  - cp $SETTINGS_XML ../$SETTINGS_XML
  - cd ..
  - rm -rf $COMMON_CONFIG_LOCAL
  - apt-get update -y && apt-get install -y python && apt-get install -y rsync openssh-client
  - "python build_pom_with_models.py"

deploy-to-staging:
  stage: deploy
  script:
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" >> ~/.ssh/id_dsa
    - chmod 600 ~/.ssh/id_dsa
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
    - "./mvnw $MAVEN_POM_WITH_MODELS $MAVEN_CLI_OPTS $MAVEN_OPTS package -DskipTests"
    - WAR_FILE=$(find target -maxdepth 1 -type f -name "*.war" | sort -n | tail -1)
    - if [ -z "$WAR_FILE" ]; then echo "No WAR files found in target directory"; exit 1; fi
    - echo "Stop Wildfly"
    - ssh $SERVER_USER@$SERVER_IP "sudo systemctl stop wildfly"
    - echo "Backup existing application"
    - CURRENT_VERSION=$(ssh $SERVER_USER@$SERVER_IP "ls $DEPLOYMENT_PATH/VIPSCore-*.war | head -n 1 | sed -n 's/.*VIPSCore-\(.*\)\.war/\1/p'")
    - TIMESTAMP=$(date +'%Y%m%d%H%M%S')
    - ssh $SERVER_USER@$SERVER_IP "mv $DEPLOYMENT_PATH/VIPSCore-${CURRENT_VERSION}.war $ARCHIVE_PATH/VIPSCore-${CURRENT_VERSION}-${TIMESTAMP}.war"
    - echo "Deploy $WAR_FILE"
    - scp "$WAR_FILE" $SERVER_USER@$SERVER_IP:$DEPLOYMENT_PATH
    - echo "Start Wildfly"
    - ssh $SERVER_USER@$SERVER_IP "sudo systemctl start wildfly"
  tags:
    - vips-java
  rules:
    - if: "$CI_COMMIT_REF_NAME == $MAIN_BRANCH"
  environment:
    name: staging
    url: https://vipscore02test.nibio.no
