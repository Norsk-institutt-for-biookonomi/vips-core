services:
  vipscore:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vipscore
    ports:
      - "8080:8080"
      - "9990:9990"  # WildFly management console
    environment:
      - JAVA_OPTS=-Xms512m -Xmx1024m -Djava.net.preferIPv4Stack=true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/VIPSCore/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s